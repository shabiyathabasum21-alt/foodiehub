<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodieHub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #e9e9ee; display: flex; justify-content: center; }

    .phone { width: 100%; max-width: 400px; min-height: 100vh; background: #fff; padding-bottom: 80px; position: relative; }

    .search { margin: 16px; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; display: flex; gap: 8px; }
    .search input { border: none; outline: none; width: 100%; font-size: 15px; }

    

    h2 { padding: 8px 16px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 8px 16px; }
    .cat { text-align: center; font-size: 12px; color: #555; cursor: pointer; }
    .cat .pic { width: 100%; aspect-ratio: 1; border-radius: 50%; background: #f4f4f8; display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 6px; }
    .cat:hover .pic { background: #fde8ea; }

    #msg { margin: 16px; padding: 12px; background: #f4f4f8; border-radius: 8px; font-size: 14px; display: none; }

    nav { position: fixed; bottom: 0; width: 100%; max-width: 400px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; }
    nav div { text-align: center; font-size: 12px; color: #888; cursor: pointer; }
    nav div.on { color: #e23744; font-weight: bold; }
    nav span { display: block; font-size: 20px; }
    .brand {color: #e23744;font-style: italic; text-align: center; font-size: 34px;padding: 16px 16px 0;}
    .cat .pic { overflow: hidden;}
    .cat .pic img { width: 100%; height: 100%; object-fit: cover;}
  </style>
</head>
<body>
  <div class="phone">
    <h1 class="brand">FoodieHub</h1>

    <div class="search"><input id="searchbox" placeholder="Restaurant name,Cuisine ,or a dish...🔍"></div>

    <h2>Eat what makes you happy</h2>
    <div class="grid" id="categories"></div>

    <div id="msg"></div>

    <h2>Menu</h2>
    <div id="menu"></div>
    <h2>Your Cart</h2>
    <ul id="cart"></ul>
    <div style="padding:8px 16px">
      <input id="address" placeholder="Enter your address" style="width:100%;padding:10px">
      <br><br>
      <button onclick="placeOrder()" style="background:#e23744;color:white;border:none;padding:10px 16px;border-radius:6px">Place Order</button>
    </div>
   

    <nav>
      <div class="on"><span>🛍️</span>Order</div>
      <div><span>🍽️</span>Go Out</div>
      <div><span>👑</span>Pro</div>
      <div><span>🥗</span>Nutrition</div>
    </nav>
  </div>

  <script>
    const categories = [
      { name: "Healthy",image:"image/z.healthy.jpg" },
      { name: "Home Style",image:"image/z.home.jpg" },
      { name: "Pizza", image:"image/z.piz.jpg" },
      { name: "Chicken", image:"image/z.chi.jpg" },
      { name: "Burger",image:"image/burger.jpg"  },
      { name: "Paneer",image:"image/z.pan.jpg" },
      { name: "Rolls", image:"image/z.roll.jpg" },
      { name: "Momos",image:"image/z.momo.jpg" }
    ];

    const grid = document.getElementById("categories");
    const msg = document.getElementById("msg");

    categories.forEach(c => {
      const div = document.createElement("div");
      div.className = "cat";
      div.innerHTML = `<div class="pic"><img src="${c.image}" alt="${c.name}"></div>${c.name}`;
      div.onclick = () => {
        msg.style.display = "block";
        msg.textContent = "You selected: " + c.name;
      };
      grid.appendChild(div);
    });

   
    document.querySelectorAll("nav div").forEach(item => {
      item.onclick = () => {
        document.querySelectorAll("nav div").forEach(n => n.classList.remove("on"));
        item.classList.add("on");
      };
    });
    let cart = [];

fetch("http://127.0.0.1:5000/menu")
  .then(res => res.json())
  .then(items => {
    const menu = document.getElementById("menu");
    items.forEach(i => {
      const p = document.createElement("p");
      p.style.padding = "8px 16px";
      p.textContent = i.name + " - ₹" + i.price + " ";
      const b = document.createElement("button");
      b.textContent = "Add";
      b.onclick = () => addToCart(i.name);
      p.appendChild(b);
      menu.appendChild(p);
    });
  });

function addToCart(name) {
  cart.push(name);
  const li = document.createElement("li");
  li.textContent = name;
  document.getElementById("cart").appendChild(li);
}

function placeOrder() {
  const address = document.getElementById("address").value;
  fetch("http://127.0.0.1:5000/order", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: cart.join(", "), address: address })
  })
    .then(res => res.json())
    .then(data => alert(data.message));
}

document.getElementById("searchBox").oninput = function () {
  const text = this.value.toLowerCase();
  document.querySelectorAll("#menu p").forEach(p => {
    p.style.display = p.textContent.toLowerCase().includes(text) ? "block" : "none";
  });
};
  </script>
</body>
</html>
